name: Build website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_INDEXING || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test deployment configuration
        run: npm test
      - name: Build and check public files
        run: npm run build && npm run check
      - name: Save deployable website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yc-website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
